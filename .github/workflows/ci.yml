name: CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]

jobs:
  # Docs-only changes (Markdown, LICENSE, issue and discussion templates,
  # images and pages under docs/) skip the jobs below. They are skipped with a
  # job-level `if`, not paths-ignore, so required checks still pass.
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
          else
            base="${{ github.event.before }}"
          fi
          # No usable base (manual run, new branch, rewritten history): build.
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed=$(git diff --name-only "$base" HEAD)
          echo "Changed files:"
          echo "$changed"
          docs='^(.*\.md|LICENSE.*|\.github/(ISSUE_TEMPLATE|DISCUSSION_TEMPLATE)/.*|docs/.*\.(svg|png|jpe?g|gif|webp|ico|html|css))$'
          keep=''
          code_files=$( { echo "$changed" | grep -vE "$docs"; [ -n "$keep" ] && echo "$changed" | grep -E "$keep"; } | grep -c . || true)
          if [ "$code_files" -gt 0 ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "Docs-only change: skipping the build and test jobs."
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  test:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    name: test (${{ matrix.os }} · py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.8", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Byte-compile the hook
        run: python -m py_compile hooks/pop_quiz.py
      - name: Run tests
        run: python -m unittest discover -s tests -v

  # Single required check for the test matrix. A skipped matrix job reports
  # one check under its unexpanded name, which never satisfies per-entry
  # required checks, so branch protection requires ci-ok instead.
  ci-ok:
    needs: [changes, test]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Fail if test failed or was cancelled
        run: |
          echo "test: ${{ needs.test.result }}"
          case "${{ needs.test.result }}" in
            success|skipped) exit 0 ;;
            *) exit 1 ;;
          esac
